# Compose de PRODUCCIÓN. Distinto del docker-compose.yml del repo (ese es para
# desarrollo local: bind mounts + npm run dev). Este construye las imágenes de verdad
# (build de Next.js standalone, backend sin --watch) y no monta el código fuente del
# host, para no romper lo ya compilado.
#
# Todo queda en 127.0.0.1: nginx (fuera de este compose) es la única puerta de entrada
# pública, haciendo reverse proxy por path — / al frontend, /api/ al backend — para que
# el navegador llame a la API en el mismo origen que sirve las páginas.
#
# Requiere un .env junto a este archivo (nunca versionado) con: DB_USER, DB_PASSWORD,
# DB_NAME, DATABASE_URL, JWT_SECRET, JWT_REFRESH_SECRET, API_URL, FRONTEND_URL,
# NEXT_PUBLIC_API_URL, NEXT_PUBLIC_APP_NAME, VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY,
# VAPID_SUBJECT, NEXT_PUBLIC_VAPID_PUBLIC_KEY (mismo valor que VAPID_PUBLIC_KEY —
# generar con `docker compose exec backend npx web-push generate-vapid-keys --json`,
# un par propio para prod, nunca reusar el de desarrollo), y opcionalmente
# SEED_ADMIN_PHONE/SEED_ADMIN_PASSWORD/SEED_ADMIN_FIRST_NAME/SEED_ADMIN_LAST_NAME
# para `npm run db:seed`.
#
# Los puertos de host (5433/4001/3001) son los que ya usa el despliegue actual en el VPS
# compartido con Kredired — elegidos para no chocar con los suyos (3000/5432). Si se
# despliega en un VPS propio, se pueden simplificar, pero deben coincidir con el vhost
# de nginx y con el health check del workflow de deploy.
services:
  postgres:
    image: postgres:16-alpine
    container_name: ksared_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ksared_db_data:/var/lib/postgresql/data
    networks:
      - ksared_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ksared_backend
    restart: unless-stopped
    # El Dockerfile trae CMD ["npm", "run", "dev"] (usa --watch, pensado para
    # desarrollo); en producción se corre sin watch.
    command: npm run start
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      API_PORT: 4000
      API_URL: ${API_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      SEED_ADMIN_PHONE: ${SEED_ADMIN_PHONE}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_ADMIN_FIRST_NAME: ${SEED_ADMIN_FIRST_NAME}
      SEED_ADMIN_LAST_NAME: ${SEED_ADMIN_LAST_NAME}
    ports:
      - "127.0.0.1:4001:4000"
    volumes:
      # Las fotos del INE se escriben en disco, no en la base. Sin este volumen
      # vivían en la capa de escritura del contenedor, y el deploy hace `build` +
      # `up -d` en cada push a main: eso recrea el contenedor y borraba TODAS las
      # identificaciones guardadas. Son el respaldo de cumplimiento del alta de
      # inquilinos, así que tienen que sobrevivir a los redeploys.
      - ksared_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ksared_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Sin 'target': usa la etapa final 'runner' (build standalone de producción),
      # no la etapa 'deps' que usa el compose de desarrollo.
      #
      # NEXT_PUBLIC_* se inlinea en el JS del navegador durante `next build`, adentro
      # de la imagen — pasarlo sólo como `environment:` de abajo no alcanza, porque
      # para entonces el bundle ya quedó compilado. Tiene que llegar como build arg.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
    container_name: ksared_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - backend
    networks:
      - ksared_network

volumes:
  ksared_db_data:
  ksared_uploads:

networks:
  ksared_network:
    driver: bridge
