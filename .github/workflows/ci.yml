name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Una serie de pushes seguidos al mismo branch cancela las corridas anteriores.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint · tests · integración)
    runs-on: ubuntu-latest

    # El smoke test corre contra Postgres real: valida que esquema, migraciones,
    # seed y rutas encajen entre sí, no sólo que cada pieza compile.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rentas
          POSTGRES_PASSWORD: rentas_ci
          POSTGRES_DB: rentas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rentas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://rentas:rentas_ci@localhost:5432/rentas_test
      JWT_SECRET: ci_secret
      JWT_REFRESH_SECRET: ci_refresh_secret
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        working-directory: ./backend
        run: npm ci

      - name: Lint
        working-directory: ./backend
        run: npm run lint

      - name: Generar Prisma Client
        working-directory: ./backend
        run: npx prisma generate

      # El conteo se verifica porque `node --test` da verde si el patrón resuelve a algo
      # que no son archivos de prueba (pasarle un directorio, por ejemplo): un cero tests
      # silencioso es peor que un fallo.
      - name: Pruebas unitarias
        working-directory: ./backend
        run: |
          npm run test:ci | tee test-output.txt
          # El reportero varía entre TAP (`# tests N`) y spec (`ℹ tests N`) según el
          # entorno, así que se acepta cualquiera de los dos prefijos.
          total=$(grep -oE '(#|ℹ) tests [0-9]+' test-output.txt | grep -oE '[0-9]+' | head -1 || echo 0)
          echo "Tests ejecutados: $total"
          if [ "$total" -lt 20 ]; then
            echo "::error::Se esperaban al menos 20 pruebas y sólo corrieron $total. ¿Falló el descubrimiento de archivos?"
            exit 1
          fi

      - name: Aplicar migraciones
        working-directory: ./backend
        run: npx prisma migrate deploy

      # Si el esquema y las migraciones divergen, esto falla: evita que se cuele un
      # cambio en schema.prisma sin su migración correspondiente.
      #
      # OJO: Prisma BORRA la base que reciba como --shadow-database-url, porque la usa
      # como espacio de trabajo. Por eso apunta a una base desechable aparte y nunca a
      # la que acabamos de migrar (ni jamás a una de desarrollo o producción).
      - name: Verificar que no falten migraciones
        working-directory: ./backend
        env:
          SHADOW_DATABASE_URL: postgresql://rentas:rentas_ci@localhost:5432/rentas_shadow
        run: |
          PGPASSWORD=rentas_ci createdb -h localhost -U rentas rentas_shadow
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code

      - name: Sembrar datos
        working-directory: ./backend
        run: npm run db:seed

      - name: Smoke test de la API
        working-directory: ./backend
        run: npm run test:smoke

      - name: Auditar plantillas de contrato
        working-directory: ./backend
        run: node scripts/audit-contract-templates.js

  frontend:
    name: Frontend (lint · types · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: ./frontend
        run: npm ci

      - name: Lint
        working-directory: ./frontend
        run: npm run lint

      - name: Typecheck
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
        run: npm run build

  docker:
    name: Imágenes Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Sólo se construyen para verificar que los Dockerfile siguen siendo válidos.
      # El push al registro vive en deploy.yml, que corre después de este workflow.
      - name: Construir imagen del backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Construir imagen del frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
