name: Deploy

# Corre sólo si CI pasó en main. Las verificaciones (lint, tests, build) viven en ci.yml
# y no se duplican aquí.
on:
  workflow_run:
    workflows: ['CI']
    branches: [main]
    types: [completed]
  workflow_dispatch:

jobs:
  # El despliegue depende de secretos que quizá aún no estén configurados. En vez de
  # fallar en rojo, este job los detecta y el siguiente se salta de forma limpia.
  preflight:
    name: Revisar configuración
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    outputs:
      can-deploy: ${{ steps.check.outputs.can-deploy }}
    steps:
      - id: check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          if [ -n "$VPS_HOST" ] && [ -n "$VPS_USER" ] && [ -n "$VPS_SSH_KEY" ] && [ -n "$DEPLOY_PATH" ]; then
            echo "can-deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "can-deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Sin VPS_HOST/VPS_USER/VPS_SSH_KEY/DEPLOY_PATH: se omite el despliegue."
          fi

  deploy:
    name: Desplegar al VPS
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.can-deploy == 'true'
    steps:
      # El VPS es compartido con otra app (Kredired) que corre en contenedores y un
      # vhost de nginx completamente aparte. Este workflow sólo toca lo que vive dentro
      # de DEPLOY_PATH: `docker compose` sin -p usa el nombre del directorio como
      # namespace del proyecto, así que nunca puede alcanzar los contenedores de la otra
      # app aunque algo saliera mal aquí.
      #
      # Construye la imagen EN el propio VPS (no hay publicación a un registro externo):
      # para un proyecto de este tamaño, evita depender de credenciales de Docker Hub y
      # mantiene un solo lugar de verdad para el Dockerfile.
      - name: Actualizar, construir y desplegar
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            git pull origin main

            COMPOSE="docker compose -f docker-compose.prod.yml --env-file .env"

            $COMPOSE build
            # Las migraciones se aplican antes de levantar la app, para que el código
            # nuevo nunca hable con un esquema viejo.
            $COMPOSE run --rm backend npx prisma migrate deploy
            $COMPOSE up -d

            # El backend sólo escucha en loopback (nginx es la única puerta pública),
            # así que el health check corre en el propio VPS contra ese puerto.
            for i in $(seq 1 15); do
              if curl -fsS http://127.0.0.1:4001/api/health > /dev/null; then
                echo "✅ Backend respondiendo"
                exit 0
              fi
              echo "esperando al backend ($i/15)..."
              sleep 4
            done
            echo "❌ El backend no respondió tras el despliegue"
            $COMPOSE logs --tail 50 backend
            exit 1
