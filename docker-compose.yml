services:
  postgres:
    image: postgres:16-alpine
    container_name: rentas_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-rentas}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rentas_dev}
      POSTGRES_DB: ${DB_NAME:-rentas_db}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=es_ES.UTF-8
    ports:
      - "${DB_HOST_PORT:-5442}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rentas_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-rentas}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rentas_backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${DB_USER:-rentas}:${DB_PASSWORD:-rentas_dev}@postgres:5432/${DB_NAME:-rentas_db}
      JWT_SECRET: ${JWT_SECRET:-dev_secret_key_change_in_production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_refresh_secret_key}
      API_PORT: 4000
      API_URL: http://localhost:4000
      FRONTEND_URL: http://localhost:3000
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@ksared.local}
    ports:
      - "${BACKEND_HOST_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
      # Las fotos del INE quedan en ./backend/uploads del host por el bind mount de
      # arriba (está en .gitignore). En prod es un volumen nombrado — ver
      # docker-compose.prod.yml, donde su ausencia borraba las fotos en cada deploy.
    networks:
      - rentas_network
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: deps
    container_name: rentas_frontend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      NEXT_PUBLIC_APP_NAME: "KsaRed"
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - rentas_network
    command: npm run dev

volumes:
  postgres_data:

networks:
  rentas_network:
    driver: bridge
